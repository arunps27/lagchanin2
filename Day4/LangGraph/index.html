<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LangGraph RAG Chatbot</title>
<style>
*{box-sizing:border-box}body{font:14px system-ui,sans-serif;margin:0;background:#f4f5f7;color:#1c1e21}
header{background:#1c2b4a;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px #0002;margin-bottom:16px}
h3{margin:0 0 10px}button{background:#2d5bff;color:#fff;border:0;border-radius:5px;padding:7px 12px;cursor:pointer}
button.sec{background:#e4e6eb;color:#222}button.del{background:#d93025}button:disabled{opacity:.5}
input[type=text],input[type=password],textarea{width:100%;padding:7px;border:1px solid #ccd;border-radius:5px;margin:4px 0}
#graph{overflow:auto;text-align:center;min-height:120px}
.node{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee}
.node span.d{flex:1;color:#555}.tag{font-size:11px;background:#e8eefc;border-radius:4px;padding:1px 6px}
#log{height:340px;overflow:auto;border:1px solid #dde;border-radius:6px;padding:8px;background:#fafbfc}
.m{margin:6px 0;padding:8px 10px;border-radius:8px;white-space:pre-wrap;max-width:90%}
.u{background:#2d5bff;color:#fff;margin-left:auto;width:fit-content}.b{background:#eceff4}
.row{display:flex;gap:8px}.row input{flex:1}#status{color:#555;margin-top:6px}
</style></head><body>
<header><b>LangGraph RAG Chatbot</b><span>Groq · openai/gpt-oss-120b</span></header>
<main>
<div>
  <div class="card"><h3>1. Groq API key</h3>
    <div class="row"><input type="password" id="key" placeholder="gsk_... (skip if GROQ_API_KEY is set on the server)">
    <button onclick="setKey()">Save</button></div></div>
  <div class="card"><h3>2. Upload data</h3>
    <input type="file" id="files" multiple accept=".txt,.md,.pdf,.docx,.csv,.json">
    <button onclick="upload()" style="margin-top:6px">Upload &amp; process</button>
    <div id="status"></div></div>
  <div class="card"><h3>3. Chat</h3>
    <div id="log"></div>
    <div class="row" style="margin-top:8px"><input type="text" id="q" placeholder="Ask about your data…" onkeydown="if(event.key==='Enter')ask()">
    <button id="send" onclick="ask()">Send</button></div></div>
</div>
<div>
  <div class="card"><h3>LangGraph</h3>
    <div id="graph">Upload data to view the graph.</div></div>
  <div class="card"><h3>Edit nodes</h3>
    <div id="nodes"></div>
    <hr><b>Add custom node</b> <small>(LLM step that post-processes the answer)</small>
    <input type="text" id="cn" placeholder="Node name, e.g. translate_to_french">
    <textarea id="ci" rows="2" placeholder="Instruction, e.g. Translate the answer to French"></textarea>
    <button onclick="addCustom()">Add node</button></div>
</div>
</main>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
mermaid.initialize({startOnLoad:false,theme:"default"});
const $=id=>document.getElementById(id);
let ready=false;
async function api(url,opt){const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.detail||r.statusText);return j}
async function render(p){
  ready=p.ready;
  $("nodes").innerHTML=p.nodes.map(n=>`<div class="node"><b>${n.id}</b>
   <span class="tag">${n.core?"core":n.kind}</span><span class="d">${n.desc}</span>
   ${n.core?"":n.enabled?`<button class="del" onclick="act('del','${n.id}')">Remove</button>`
     :`<button class="sec" onclick="act('tog','${n.id}')">Add</button>`}
   ${n.kind==="custom"&&!n.enabled?`<button class="del" onclick="act('del','${n.id}')">Delete</button>`:""}</div>`).join("");
  if(p.ready){const {svg}=await mermaid.render("g"+Date.now(),p.mermaid);$("graph").innerHTML=svg;}
}
window.act=async(k,id)=>{try{render(await api(k==="del"?`/api/nodes/${id}`:`/api/nodes/${id}/toggle`,{method:k==="del"?"DELETE":"POST"}))}catch(e){alert(e.message)}};
window.addCustom=async()=>{try{render(await api("/api/nodes/custom",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({name:$("cn").value,instruction:$("ci").value})}));$("cn").value=$("ci").value=""}catch(e){alert(e.message)}};
window.setKey=async()=>{await api("/api/key",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({api_key:$("key").value})});$("key").value="";alert("Key saved")};
window.upload=async()=>{const f=$("files").files;if(!f.length)return;const fd=new FormData();for(const x of f)fd.append("files",x);
  $("status").textContent="Processing…";
  try{const p=await api("/api/upload",{method:"POST",body:fd});$("status").textContent=`Indexed ${p.files.length} file(s), ${p.chunks} chunks.`;render(p)}
  catch(e){$("status").textContent="Error: "+e.message}};
function add(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;$("log").appendChild(d);$("log").scrollTop=1e9;return d}
window.ask=async()=>{const q=$("q").value.trim();if(!q)return;if(!ready)return alert("Upload data first");
  $("q").value="";add(q,"u");const w=add("Thinking…","b");$("send").disabled=true;
  try{const r=await api("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})});w.textContent=r.answer}
  catch(e){w.textContent="Error: "+e.message}$("send").disabled=false};
api("/api/graph").then(p=>{p.nodes&&render(p)});
</script></body></html>
